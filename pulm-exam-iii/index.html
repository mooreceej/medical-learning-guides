<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pulmonary Exam III Learning Guides</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#172033;--muted:#64748b;--line:#e5e7eb;--accent:#2563eb;--accent2:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(180deg,#fff,#eff6ff);border-bottom:1px solid var(--line);padding:48px 20px 40px;text-align:center}
h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.03em}header p{margin:0;color:var(--muted)}
main{max-width:1120px;margin:auto;padding:34px 20px 64px}.top{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:24px}
h2{margin:0}.count{color:var(--muted);margin-top:4px}.search{width:min(360px,100%);padding:12px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.05);display:flex;flex-direction:column;min-height:180px}
.card h3{margin:0 0 10px;font-size:1.16rem}.card p{color:var(--muted);flex:1}.btn{display:inline-flex;width:fit-content;padding:11px 16px;border-radius:9px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}.btn:hover{background:var(--accent2)}
.status{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;color:var(--muted)}.back{display:inline-block;margin-top:26px;color:var(--accent);text-decoration:none;font-weight:700}
footer{text-align:center;color:#94a3b8;padding:24px 20px 44px}
</style>
</head>
<body>
<header><h1>🫁 Pulmonary Exam III</h1><p>CJ's Exam III Learning Lab library</p></header>
<main>
<div class="top"><div><h2>Exam III Learning Guides</h2><div class="count" id="count">Loading guides…</div></div>
<input id="search" class="search" type="search" placeholder="Search Exam III guides…" aria-label="Search Exam III guides"></div>
<div id="grid" class="grid"><div class="status">Loading your Exam III Learning Labs…</div></div>
<a class="back" href="../">← Back to exam library</a>
</main>
<footer>Pulmonary Exam III • CJ's Medical Learning Guides</footer>
<script>
const owner="mooreceej",repo="medical-learning-guides",folder="pulm-exam-iii",grid=document.getElementById("grid"),count=document.getElementById("count"),search=document.getElementById("search");let guides=[];
function pretty(n){return n.replace(/\.html$/i,"").replace(/\s*\(\d+\)\s*$/,"").replace(/[_-]+/g," ").replace(/\b(Interactive )?Learning Lab\b/gi,"").replace(/\s+/g," ").trim().replace(/\b\w/g,c=>c.toUpperCase())}
function render(list){grid.innerHTML="";count.textContent=`${list.length} guide${list.length===1?"":"s"}`;if(!list.length){grid.innerHTML='<div class="status">No matching guides found.</div>';return}list.forEach(f=>{const c=document.createElement("article");c.className="card";const h=document.createElement("h3");h.textContent=pretty(f.name);const p=document.createElement("p");p.textContent="Open the interactive Exam III Learning Lab.";const a=document.createElement("a");a.className="btn";a.href="./"+encodeURIComponent(f.name);a.textContent="Open Learning Lab →";c.append(h,p,a);grid.appendChild(c)})}
async function load(){try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`);if(!r.ok)throw new Error();const files=await r.json();guides=files.filter(f=>f.type==="file"&&/\.html$/i.test(f.name)&&f.name.toLowerCase()!=="index.html").sort((a,b)=>pretty(a.name).localeCompare(pretty(b.name)));render(guides)}catch(e){grid.innerHTML='<div class="status">Could not load the guide list right now.</div>';count.textContent="Unable to load"}}
search.addEventListener("input",()=>{const t=search.value.trim().toLowerCase();render(guides.filter(f=>pretty(f.name).toLowerCase().includes(t)))});load();
</script>
</body></html>
