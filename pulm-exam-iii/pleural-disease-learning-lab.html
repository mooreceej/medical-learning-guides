function exam(){$('app').innerHTML=`<div class="print-sheet"><div class="row spread no-print"><p>Print this section or save it as a PDF through your browser.</p><button class="primary" onclick="window.print()">Print exam sheet</button></div><div class="card"><span class="eyebrow">Final review</span><h2>Pleural disease · Exam sheet</h2><p><b>Stability → air versus fluid → mechanism → evidence → next action.</b></p>${master()}</div><div class="grid"><div class="card"><h3>Equations and thresholds</h3><p><b>P<sub>TP</sub> = P<sub>alv</sub> − P<sub>pl</sub>.</b> At rest: 0 − (−5) = +5 cm H₂O. Air equalization removes the distending gradient.</p><p><b>Light: any ONE positive → exudate.</b><br>Protein PF/serum >0.5<br>LDH PF/serum >0.6<br>PF LDH >⅔ × serum LDH ULN (standard).</p><div class="note warn"><b>Slide 37 instead prints 0.6 × ULN.</b> Do not silently substitute one for the other on a lecture-specific item. Check all three criteria; ULN ≠ measured serum LDH.</div><p><b>Special fluids:</b> triglycerides >110 mg/dL; PF Hct >0.5 × blood Hct; PF/serum creatinine >1.</p></div><div class="card"><h3>High-yield distinctions</h3><p><b>Parietal:</b> pain sensitive, systemic supply, lymphatic stomata. <b>Visceral:</b> lung surface, no somatic pain sensitivity.</p><p><b>Air:</b> hyperresonant, reduced sounds/fremitus; pleural line with absent markings beyond it. <b>Fluid:</b> dull, reduced sounds, basal opacity/meniscus.</p><p><b>Normal:</b> 7–15 mL present; 17–35 mL/day made (70 kg, lecture). pH 7.60–7.64. Production is not stored volume.</p><p><b>Primary:</b> young/tall/thin/smoker without known lung disease. <b>Secondary:</b> COPD, CF, pneumonia. <b>Tension:</b> rising pressure + hemodynamic compromise.</p></div></div><div class="grid" style="margin-top:14px"><div class="card"><h3>Next-step rules</h3><p>Unstable suspected tension → decompression; do not wait for CT.</p><p>CHF-pattern effusion + nocturnal dyspnea → investigate/treat heart failure; lecturer selects <b>echo</b>.</p><p>Complicated infection / pus → <b>antibiotics + drainage</b>. Locules → tPA/DNase; surgery if persistent.</p><p>Recurrent pneumothorax → pleurodesis / surgery. Recurrent malignant fluid → selected pleurodesis or tunneled catheter.</p><p>Two negative cytologies + persistent cancer suspicion → <b>pleural biopsy</b> (VATS in lecture).</p></div><div class="card"><h3>Traps to avoid</h3><p>Exudate ≠ empyema; both uncomplicated and complicated parapneumonic fluids are exudates.</p><p>Lecture: pH <7.2 and low glucose favor complicated infection. Slide 40 glucose <60; slide 46 uses <40. BTS infection threshold includes pH <b>≤7.2</b>.</p><p>Low glucose also occurs in rheumatoid disease; supplemental differential includes TB and malignancy.</p><p>Lymphocytes >80%: TB, chyle, lymphoma, RA, sarcoid, post-CABG. Eosinophils >10% do not exclude malignancy.</p><p>Negative cytology ≠ no cancer. Absent lung sliding ≠ proof of tension. Rapid re-expansion can cause edema.</p></div></div><p class="source">Lecture: ${PPT}, slides 3–56; transcript and supplied professor questions. Guideline clarifications: BTS Pleural Disease Appendix 1 (2023). See Sources for context and limits.</p></div>`}
function sources(){$('app').innerHTML=`<div class="card"><h2>Sources and clarifications</h2><p>This guide uses all five uploaded files. Slide numbers refer to the actual 59-slide deck order, not the stale slide labels on its answer-key slide.</p>${table(['Material','Use'],[['Pasted text.txt','Design, interaction, source-reveal and verification requirements.'],['9-10-2026_Foot_Pleural_Disease_Objectives.docx','Six-objective coverage map.'],[PPT,'All slides, including grouped images, table on slide 46, poll images and answer key on slide 58.'],['Pleural Diseases-transcript.txt','Explanations, treatment choices, professor emphasis and polling answers.'],['Pleural_Disease_-_Practice_Questions.docx','All four questions and supplied answer key; associated radiograph embedded.']])}<p>${D.questions.length} MCQs: 4 professor handout questions, 9 adapted lecture polls/cases and ${D.questions.length-13} original questions. Adaptations shorten wording or isolate a reasoning step. Answer options shuffle while preserving correct answer identity. The handout retains its four- or five-choice count.</p></div><div class="card"><h3>Meaningful discrepancies</h3>${table(['Issue','Lecture wording / intent','Clarification'],[['Light’s third criterion','Slide 37 and transcript: >0.6 × serum LDH ULN.','Standard: >⅔ × serum LDH ULN. Both calculator outputs are shown. <a href="'+BTS+'">BTS Appendix 1, p. 3</a>.'],['Pleural turnover','Slides 6/56: parietal → space → visceral/lymphatics. Transcript correctly says only parietal lymphatics drain the space directly.','Parietal lymphatic stomata are the major fluid-removal route. Visceral reabsorption is part of the lecture’s simplified model. <a href="https://www.ncbi.nlm.nih.gov/books/NBK513353/">Physiology reference</a>.'],['Exudate mechanism','Slide 36 says increased oncotic pressure; transcript emphasizes inflammation/permeability.','Specify compartment: increased pleural protein can raise pleural oncotic pressure; permeability and impaired lymph drainage explain protein-rich fluid. Increased plasma oncotic pressure would oppose filtration. <a href="https://www.ncbi.nlm.nih.gov/books/NBK448189/">Pleural effusion reference</a>.'],['Low glucose','Slide 40 / transcript emphasize glucose <60 with empyema and RA, with transcript saying only these two.','The list is not exhaustive: malignancy and TB can also lower glucose. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6542220/">Pleural-fluid interpretation review</a>.'],['Parapneumonic table','Slide 46: glucose >40 uncomplicated / <40 complicated; culture +/− listed under uncomplicated; pH >7.2 versus <7.2.','Preserve the lecture numbers, but positive microbiology favors pleural infection. BTS uses pH ≤7.2 for high-risk nonpurulent suspected infection, with intermediate-risk assessment above that. <a href="'+BTS+'">BTS pathway, p. 5</a>.'],['Conservative pneumothorax care','Transcript favors inpatient observation for small asymptomatic cases.','Selected stable patients can follow conservative/ambulatory pathways with follow-up. The symptomatic lecture case retains its chest-tube answer. <a href="'+BTS+'">BTS pathway, p. 1</a>.'],['Cytology yield','Slide 47: ≈60% first sample, ≈89% with second; biopsy after two negative samples if suspicion remains.','Retain as lecture estimates, not universal diagnostic performance. Yield varies by tumor and sampling; negative cytology can require further investigation. <a href="https://www.ncbi.nlm.nih.gov/books/NBK448189/">Reference</a>.'],['Incomplete Light inputs','Handout Q2 and slides 53–55 omit serum LDH ULN.','The intended answers are transudative, but the third criterion cannot be independently verified. Original calculation questions include the ULN.'],['Case cell count','Slide 53 prints 2,100/mcL; transcript says 100 white cells.','Preserve the slide value when discussing the discrepancy; the echo answer relies on chemistry and cardiac symptoms. Cell count alone is not a Light criterion.'],['Handout Q4','Key selects tension pneumothorax from severe dyspnea and the provided image.','The image suggests displacement, but the stem lacks BP / shock data. Preserve key and flag limitation; do not teach size alone as tension.'],['Key slide numbering','Slide 58 references older slide numbers.','Polls actually occur on 6, 23, 25, 29, 33, 34, 49, 51 and 54. References here use actual deck positions and transcript-confirmed answers.']])}</div><div class="card"><h3>Scope and image handling</h3><p>Original radiology and ultrasound images were extracted from the presentation, including grouped objects. Diagnostic slide titles and adjacent answer text are omitted from blind figure views. Existing neutral arrows that indicate a feature were retained. Standalone images are rescaled proportionally; clinical findings were not erased. Full-slide screenshots are not included; post-reveal context is provided in text with exact slide references.</p><p>Figures can recur across general study and practice. For a fully blind first attempt, complete Practice before browsing Lecture figures. Within a block, only the submitted question’s feedback is revealed; no future answer key or related-slide gallery is shown.</p><p>Detailed chylothorax diets, thoracic duct interventions, traumatic drainage-volume thresholds and procedural decompression technique are outside the lecture’s supplied treatment depth. The guide states this rather than inventing professor content.</p><p>Slides 44 and 59 provide additional thoracic duct and Starling detail. Chyle is intestinal fat-rich lymph, about 2 L/day in the lecture, with protein, fat and lymphocytes. The duct starts at the cisterna chyli, ascends posteriorly, crosses toward the left, and returns to the venous circulation. Its injury can produce chylothorax.</p><details><summary>Thoracic duct reference figure</summary>${imageEl('12','Thoracic duct anatomy from slide 44')}<p class="source">${PPT}, slide 44.</p></details><p class="small">Supplemental explanations include transpulmonary-pressure arithmetic, the link from tension to reduced venous return, and brief mechanism-based interpretation. They clarify the lecture rather than add a separate board-review syllabus.</p></div><div class="card"><h3>Verification</h3><p id="verifyText">Verified in headless Chromium: all nine sections, selectors, mechanism reveals, pressure/turnover calculations, Light criteria including equality and the discrepancy interval, invalid-input handling, infection pH boundary, figure reveal/reset, all 42 questions with shuffled four- and five-option scoring, incorrect scoring, confidence recording, per-question source isolation, no automatic advance, reload persistence, and submitted-answer review. The test run passed 323 checks with no JavaScript page errors. Desktop and 390-pixel mobile layouts were visually inspected; the two-page A4 exam-sheet print view was rendered. Other browsers and physical printer output were not tested.</p><p>Offline function includes navigation, embedded images, calculations and practice. External source links require internet. Progress uses browser local storage, which can be restricted for local files; an export option provides a separate record. All medical content is for study, with lecture-versus-reference differences explicitly retained.</p></div>`}
