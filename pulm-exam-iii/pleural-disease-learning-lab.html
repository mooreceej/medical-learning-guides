:root{color-scheme:light;--bg:#f7f6f1;--card:#fff;--ink:#23343a;--muted:#56696c;--line:#dce4df;--teal:#176b65;--pale:#eaf4ef;--amber:#fff2d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button,select,input{border:1px solid #afbfba;border-radius:9px;background:white;color:var(--ink);padding:10px 13px}button{cursor:pointer}button:hover{border-color:var(--teal);background:var(--pale)}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--teal);color:white;border-color:var(--teal)}:focus-visible{outline:3px solid #b37110;outline-offset:3px}header{max-width:1160px;margin:auto;padding:32px 28px 20px}h1{font-size:clamp(30px,5vw,48px);line-height:1.13;letter-spacing:-1.7px;margin:8px 0 13px}h2{font-size:28px;line-height:1.25;margin:0 0 14px}h3{font-size:19px;margin:6px 0 10px}p{margin:8px 0 16px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:750;text-transform:uppercase;color:var(--teal)}.muted,small{color:var(--muted)}.small{font-size:13px}nav{display:flex;gap:7px;flex-wrap:wrap;max-width:1160px;margin:auto;padding:0 28px 22px}nav button{font-size:14px;padding:8px 11px}nav button.active{background:var(--pale);border-color:var(--teal);font-weight:700}main{max-width:1104px;margin:0 auto 64px;padding:0 0 24px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:25px;margin-bottom:18px;box-shadow:0 3px 14px #23343a05}.hero{background:linear-gradient(120deg,#eaf4ef,#fffaf0)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid.three{grid-template-columns:repeat(3,1fr)}.grid>.card{margin-bottom:0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.spread{justify-content:space-between}.note{padding:15px 18px;background:#edf4fa;border-left:4px solid #5385a3;border-radius:6px;margin:14px 0}.warn{background:var(--amber);border-left-color:#ac7b26}.good{background:#eaf th:1104px;margin:0 auto 25px;color:var(--muted);font-size:12px}ul,ol{padding-left:22px}.hidden{display:none!important}@media(max-width:760px){header{padding:25px 17px 16px}nav{padding:0 17px 18px;gap:5px}main{padding:0 14px 20px}.grid,.grid.three{grid-template-columns:1fr}.card{padding:19px}h1{letter-spacing:-1px}footer{padding:0 16px}.row>*{max-width:100%}td,th{padding:9px}.compare-table td{min-width:190px}button{min-height:44px}}@media print{body{background:white;font-size:11px}header,nav,footer,button,.no-print{display:none!important}main{max-width:none;padding:0;margin:0}.card{box-shadow:none;break-inside:avoid;padding:10px;margin:8px 0;border-radius:0}.grid{gap:8px}.print-sheet{font-size:11px}.print-sheet h2{font-size:22px}.print-sheet h3{font-size:14px}.print-sheet th,.print-sheet td{padding:5px;font-size:10px;min-width:0}.print-only{display:block}.note{padding:8px;margin:7px 0}a{color:inherit;text-decoration:none}}

const D={"conditions": [{"name": "Primary spontaneous pneumothorax", "Cause": "No known underlying lung disease; classically young, tall, thin male smoker. FLCN variants cause familial susceptibility.", "Mechanism": "Apical subpleural bleb ruptures \u2192 air enters pleura \u2192 distending pressure falls \u2192 lung recoils. Greater apical distending pressure helps explain the tall-body association.", "Findings": "Sudden localized chest pain and dyspnea, often at rest. Reduced breath sounds and tactile fremitus; hyperresonant percussion. Vitals may initially be near normal. Rare Horner syndrome from sympathetic traction.", "Diagnosis": "CXR: visceral pleural line with no peripheral lung markings. US: absent sliding, barcode pattern. CT is most definitive if uncertainty remains and patient is stable.", "Treatment": "Lecture: observe small asymptomatic cases; oxygen for hypoxia; aspiration or small-bore chest tube for symptomatic/large cases. Recurrence \u2192 pleurodesis or surgery.", "Trap": "A tall thin person can be female. A large pneumothorax is not automatically tension. The bleb begins within lung, not as air already in the pleural space.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 8\u201324"}, {"name": "Secondary spontaneous pneumothorax", "Cause": "Underlying COPD, cystic fibrosis, pneumonia, or other lung disease.", "Mechanism": "Diseased lung leaks into pleura \u2192 loss of distending pressure. Reduced baseline respiratory reserve can magnify impairment.", "Findings": "Acute chest pain and dyspnea superimposed on known lung disease; same air-associated examination pattern.", "Diagnosis": "CXR / ultrasound; CT if needed. Classify using history as well as imaging.", "Treatment": "Drainage and treatment of underlying disease; management depends on symptoms and stability. Supplemental guidance treats underlying lung disease as a high-risk feature.", "Trap": "\u201cSpontaneous\u201d does not mean normal lungs; primary versus secondary depends on underlying disease.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 8, 12, 16\u201324"}, {"name": "Traumatic / iatrogenic pneumothorax", "Cause": "Penetrating or blunt trauma; thoracentesis, central venous line, bronchoscopic biopsy; barotrauma from ventilation or blast.", "Mechanism": "Chest-wall communication or alveolar leak lets air enter pleura. A sufficiently open chest wound can keep pleural pressure near atmospheric pressure.", "Findings": "Acute dyspnea, hypoxemia, reduced breath sounds; bubbling chest wound supports open pneumothorax.", "Diagnosis": "Clinical examination plus imaging if stable. Look for associated injury.", "Treatment": "Restore pleural mechanics with drainage; manage the injury and oxygenation. If tension develops, emergency decompression precedes imaging.", "Trap": "Traumatic includes procedure-related and pressure injury, not just stab wounds. The chest wall normally tends outward; lung recoils inward.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 8\u201312, 48\u201351"}, {"name": "Tension pneumothorax", "Cause": "A one-way air leak can complicate several pneumothorax etiologies.", "Mechanism": "Air enters but cannot exit \u2192 rising pleural pressure \u2192 compression/mediastinal displacement \u2192 reduced venous return and cardiac output \u2192 obstructive shock.", "Findings": "Severe respiratory distress, hypotension, marked tachycardia, cyanosis; reduced unilateral breath sounds. Tracheal deviation away can occur, but need not be present.", "Diagnosis": "Clinical emergency. Do not delay decompression for CT or CXR in an unstable patient with strong suspicion.", "Treatment": "Immediate decompression followed by definitive chest drainage. Lecture mentions needle decompression in the second intercostal space; procedural site selection is not taught by this guide.", "Trap": "Tension is a pressure/hemodynamic syndrome, not merely a radiographic size category. Re-expansion edema is a complication of re-expansion, not the cause of pre-treatment shock.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 16, 25\u201326; transcript"}, {"name": "Transudative effusion", "Cause": "Heart failure: \u2191 capillary hydrostatic pressure. Cirrhosis/hypoalbuminemia or nephrotic protein loss: \u2193 plasma oncotic pressure. Renal volume retention: \u2191 venous pressure.", "Mechanism": "A systemic force imbalance increases fluid entry relative to removal without primary pleural inflammation. Fluid is relatively low in protein/LDH.", "Findings": "Dyspnea, reduced breath sounds, dull percussion; systemic disease clues matter. May be asymptomatic.", "Diagnosis": "Apply all three Light criteria. If none positive, transudate. Lecture CHF case: protein ratio 0.26, LDH ratio 0.33 \u2192 echo for cardiac function.", "Treatment": "Treat underlying cause. Diagnostic sampling if uncertain; therapeutic drainage for substantial symptoms. Do not reflexively use chest tubes or pleurodesis for uncomplicated CHF.", "Trap": "Low protein alone is insufficient. Without serum LDH upper limit, the third criterion cannot be checked. High cell count alone does not override Light criteria.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 28\u201338, 52\u201356"}, {"name": "Exudative effusion", "Cause": "Infection (bacteria, TB, parasites), malignancy, drugs, connective-tissue disease, lymphatic disorders.", "Mechanism": "Inflammation increases permeability and protein entry; impaired lymph drainage can also accumulate protein-rich fluid. Pleural oncotic pressure may increase as a consequence.", "Findings": "Dyspnea, cough, pleuritic pain; fever or weight loss depends on cause. Dullness and diminished breath sounds.", "Diagnosis": "Any one positive Light criterion \u2192 exudate. Then pH, glucose, differential, culture and cytology narrow the cause.", "Treatment": "Treat the cause; sample for diagnosis and drain for symptoms or infection. Recurrence may warrant pleurodesis.", "Trap": "Exudate is a fluid classification, not proof of infection or an automatic chest-tube indication. Slide 36\u2019s oncotic shorthand is not a complete mechanism.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 30\u201345"}, {"name": "Uncomplicated parapneumonic effusion", "Cause": "Adjacent pneumonia with a reactive pleural effusion.", "Mechanism": "Inflammatory fluid forms without established complicated pleural-space infection.", "Findings": "Pneumonia symptoms with simple-appearing fluid; no frank pus.", "Diagnosis": "Exudate; lecture table: pH >7.2, glucose >40 mg/dL, simple US appearance. Its culture \u201c+/\u2212\u201d entry is an oversimplification; positive microbiology argues for infection.", "Treatment": "Treat pneumonia; assess/sample as indicated. Often no chest tube when genuinely uncomplicated.", "Trap": "Both uncomplicated and complicated effusions are exudates. Slide 46\u2019s glucose boundary is 40, while slide 40 flags glucose <60 more broadly.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 39\u201340, 45\u201346; transcript"}, {"name": "Complicated parapneumonic effusion / empyema", "Cause": "Pneumonia with pleural infection; empyema means frank pus in the pleural space.", "Mechanism": "Infection and inflammation lower pH/glucose; fibrin septa create loculations \u2192 poor drainage \u2192 persistent infected material.", "Findings": "Fever and dyspnea; ultrasound may show complex, septated fluid. Frank pus establishes empyema.", "Diagnosis": "Lecture: pH <7.2, low glucose (slide 46 <40), positive microbiology and/or pus. Supplemental BTS: pH \u22647.2 in suspected infection favors a drain if safely accessible.", "Treatment": "Antibiotics plus chest tube drainage. Residual loculated infection may need intrapleural tPA + DNase; persistent disease may require surgical decortication.", "Trap": "Do not wait for pus if infection is already complicated. Rheumatoid disease can also produce low glucose/pH, so chemistry needs context.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 39\u201341, 45\u201346; transcript"}, {"name": "Malignant effusion", "Cause": "Pleural malignancy or metastatic disease; weight loss and smoking history raise suspicion.", "Mechanism": "Pleural involvement/permeability changes and impaired lymphatic drainage cause fluid accumulation.", "Findings": "Progressive dyspnea, weight loss; dullness and reduced breath sounds. Pleural nodules on US increase suspicion.", "Diagnosis": "Cytology first. Lecture sensitivity \u224860% first sample and \u224889% after second. Persistent suspicion after two negative samples \u2192 VATS pleural biopsy. Yield varies by tumor.", "Treatment": "Treat malignancy. Recurrent symptomatic fluid: indwelling tunneled catheter (PleurX) or selected pleurodesis for symptom control.", "Trap": "Negative cytology does not exclude cancer. Repeated drainage alone does not treat the malignancy. Exact cytology percentages are lecture estimates.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 28\u201329, 42, 47"}, {"name": "Chylothorax", "Cause": "Thoracic duct trauma/disruption, lymphatic obstruction or other lymphatic disorder.", "Mechanism": "Intestinal fat-rich lymph leaks into pleura. Thoracic duct carries chyle toward the venous circulation.", "Findings": "Often milky fluid, usually lymphocyte predominant. Symptoms reflect effusion size and ongoing losses.", "Diagnosis": "Lecture: pleural triglycerides >110 mg/dL. Appearance alone is insufficient.", "Treatment": "Address leak/underlying cause and drain when indicated. Detailed nutritional or surgical protocols are beyond lecture scope.", "Trap": "Milky does not automatically mean pus. Supplemental: chylomicrons support chyle; chronic cholesterol-rich pseudochylothorax is a counterpart.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 41, 43\u201344"}, {"name": "Hemothorax", "Cause": "Usually trauma causing blood to enter pleural space.", "Mechanism": "Blood accumulation compresses lung; substantial bleeding can also impair circulating volume.", "Findings": "Bloody fluid with trauma history; respiratory compromise.", "Diagnosis": "Pleural hematocrit >50% of peripheral blood hematocrit, per lecture. Example: blood Hct 40%, fluid Hct 24% \u2192 ratio 0.60.", "Treatment": "Treat traumatic bleeding and drain as clinically indicated. Lecture does not give surgical volume thresholds.", "Trap": "A blood-tinged effusion is not automatically a hemothorax. Compare hematocrit values; do not require fluid Hct >50 percentage points.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 39, 41, 43"}, {"name": "Urinothorax", "Cause": "Usually obstructive uropathy; uncommon in lecturer\u2019s experience.", "Mechanism": "Urine-related fluid reaches pleural space in a urinary obstructive/leak context.", "Findings": "Effusion symptoms with urinary tract context.", "Diagnosis": "Lecture: pleural-fluid creatinine / serum creatinine >1.", "Treatment": "Correct the urinary cause; drainage for symptoms when indicated. Detailed management not specified in lecture.", "Trap": "Use creatinine, not triglycerides or hematocrit. Transcript \u201cneuropathy\u201d is a transcription error for uropathy.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 43; transcript"}, {"name": "Rheumatoid / TB-associated pleural disease", "Cause": "Rheumatoid pleurisy: autoimmune inflammation. TB: pleural infection associated with tuberculosis.", "Mechanism": "Inflammation generates exudate; glucose transport/consumption and acid accumulation can alter chemistry.", "Findings": "Effusion symptoms plus rheumatoid or infectious context.", "Diagnosis": "Lecture: both can cause low pH and lymphocyte predominance; rheumatoid disease emphasized for glucose <60. TB-directed testing as clinically indicated.", "Treatment": "Treat underlying disorder; investigate infection appropriately. Specific treatment regimens not provided in lecture.", "Trap": "Low glucose is not exclusive to empyema and rheumatoid disease; TB and malignancy can also lower glucose (supplemental clarification).", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 36, 39\u201341"}], "mechanisms": [["Normal coupling", "Chest wall tends outward while lung recoils inward.", "Pleural pressure is about \u22125 cm H\u2082O at resting end-expiration (lecture simplification).", "At alveolar pressure 0, transpulmonary pressure = 0 \u2212 (\u22125) = +5 cm H\u2082O.", "Positive transpulmonary pressure holds lung expanded; quiet inspiration makes pleural pressure more negative.", "Predict: if pleural pressure becomes 0 at the same alveolar pressure, the distending gradient disappears."], ["Air enters pleura", "An apical bleb, injured lung, or chest-wall defect opens a path.", "Air follows a pressure gradient into the normally negative-pressure space.", "Pleural pressure approaches alveolar/atmospheric pressure.", "Transpulmonary distending pressure falls \u2192 elastic lung recoil \u2192 collapse.", "Ventilation decreases \u2192 dyspnea; pleural air produces hyperresonance and reduces sound transmission."], ["One-way leak \u2192 shock", "Air can enter but cannot leave through a valve-like defect.", "Pressure accumulates instead of simply equalizing.", "Ipsilateral lung compresses and mediastinum may shift.", "Venous return falls \u2192 cardiac preload and output fall.", "Hypotension plus respiratory compromise demands decompression. Imaging must not delay treatment."], ["Systemic force imbalance", "Capillary hydrostatic pressure rises, or plasma oncotic pressure falls.", "More relatively protein-poor fluid enters pleural space.", "Lymphatic removal cannot keep up.", "Effusion compresses lung \u2192 dyspnea, dullness and diminished breath sounds.", "Treating heart/renal/liver disease addresses the driving force; fluid removal alone may be temporary."], ["Inflammation \u2192 loculation", "Pneumonia causes inflammatory pleural fluid (exudate).", "Established infection can lower glucose and pH.", "Fibrin partitions the collection into locules.", "A single tube may incompletely drain separated pockets.", "Drain + antibiotics; tPA/DNase can improve residual drainage, with surgery for persistent disease."], ["Protein-rich lymph leak", "Thoracic duct is disrupted or obstructed.", "Fat-rich intestinal lymph enters the pleura.", "Pleural triglycerides rise and lymphocytes predominate.", "Fluid accumulates and compresses the lung.", "Think chylothorax; distinguish from pus using chemistry and clinical context."], ["Pleural fluid turnover", "Parietal systemic capillary forces generate pleural fluid.", "Only a small fluid volume normally occupies this potential space.", "Lecture flux model: parietal \u2192 space \u2192 visceral/parietal stoma.", "Clarification: direct pleural lymphatic drainage is through parietal stomata; these are the major removal route.", "Increased entry or impaired removal \u2192 accumulation. Fluid is continuously renewed, not static."]], "questions": [{"id": 1, "stem": "During thoracentesis for a pleural effusion, the needle should pass through all of the following EXCEPT which structure?", "options": ["Visceral pleura", "Skin", "Parietal pleura", "Intercostal muscles", "Endothoracic fascia"], "why": ["Correct: the target is the space outside the visceral pleura; crossing it risks lung injury.", "Skin is traversed.", "Parietal pleura lines the chest wall and is traversed.", "The chest-wall route crosses intercostal muscle.", "Endothoracic fascia lies along the inner chest wall route."], "take": "Stop in the pleural space; the visceral pleura covers lung.", "source": "Pleural_Disease_-_Practice_Questions.docx, question 1; supplied answer key", "topic": "Anatomy", "kind": "Professor", "image": null}, {"id": 2, "stem": "Thoracentesis yields 400 mL of straw-colored fluid with few cells: protein 1.7 g/dL (serum 7.6), LDH 54 U/L (serum 200). Which underlying cause is LEAST likely?", "options": ["Lung cancer", "Congestive heart failure", "Liver disease", "Renal failure"], "why": ["Correct per key: cancer usually causes an exudate; these ratios support the intended transudate.", "Increased hydrostatic pressure produces a transudate.", "Low albumin can contribute to transudative fluid.", "Volume retention can produce a transudate."], "take": "Protein ratio 0.22 and LDH ratio 0.27 are below cutoffs. The source omits serum LDH ULN, so its third criterion cannot be verified.", "source": "Pleural_Disease_-_Practice_Questions.docx, question 2; supplied answer key", "topic": "Fluid analysis", "kind": "Professor", "image": null}, {"id": 3, "stem": "Pleural fluid is generated primarily by which of these forces or structures?", "options": ["Hydrostatic pressure in the parietal pleura", "Stoma in the parietal pleura", "Stoma in the visceral pleura", "Oncotic pressure in the visceral pleura"], "why": ["Correct: parietal capillary hydrostatic pressure drives filtration.", "Parietal stomata remove fluid into lymphatics.", "Direct pleural drainage stomata belong to parietal pleura.", "Intravascular oncotic pressure favors reabsorption, not fluid generation into the space."], "take": "Separate where fluid enters from where it drains.", "source": "Pleural_Disease_-_Practice_Questions.docx, question 3; supplied answer key", "topic": "Anatomy", "kind": "Professor", "image": null}, {"id": 4, "stem": "A 6\u20329\u2033 man weighing about 160 lb presents with severe shortness of breath. Oxygen is provided and the associated radiograph is obtained. What is the most likely diagnosis?", "options": ["Tension pneumothorax", "Lung cancer", "Pneumothorax without tension", "Pleural effusion"], "why": ["The supplied key selects tension pneumothorax; the image shows a large left pneumothorax with displacement toward the opposite side.", "The dominant image finding is pleural air rather than a mass.", "Air is present, but the key uses the displacement to favor tension. Clinical hemodynamics are incompletely specified.", "A large simple effusion would produce a basal opacity rather than this hyperlucent region."], "take": "Source limitation: the key is C in its original order. Tension is clinically assessed; the stem lacks BP and other shock findings, so do not generalize image size alone into a tension diagnosis.", "source": "Pleural_Disease_-_Practice_Questions.docx, question 4; supplied answer key", "topic": "Pneumothorax", "kind": "Professor", "image": "8"}, {"id": 5, "stem": "Which sequence best describes the simplified filtration\u2013reabsorption model of pleural fluid flux?", "options": ["Parietal pleura \u2192 pleural space \u2192 visceral pleura and parietal stoma", "Visceral pleura \u2192 pleural space \u2192 parietal pleura", "No flux; fluid remains static", "Direction reverses completely with each breath"], "why": ["This is the lecture\u2019s intended answer. Physiologic clarification: parietal lymphatics are the major removal route.", "This reverses the lecture\u2019s filtration gradient.", "Fluid is continuously produced and removed.", "Respiratory pressure varies, but this is not the taught turnover model."], "take": "Retain the lecture answer while distinguishing parietal lymphatic drainage from its simplified visceral reabsorption model.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 5\u20137; lecture transcript", "topic": "Anatomy", "kind": "Adapted professor", "image": null}, {"id": 6, "stem": "A tall thin medical student has acute chest pain, dyspnea and tachypnea at rest; oxygen saturation is 94%. The associated image is obtained. Which management is most appropriate?", "options": ["Tube thoracostomy, oxygen and pain control", "Oxygen alone", "Discharge with analgesics", "Observation, analgesics and oxygen alone"], "why": ["Correct: the lecturer chooses drainage for this symptomatic, sizable pneumothorax.", "Does not evacuate air promptly in the symptomatic case.", "The lecturer does not discharge this symptomatic patient.", "Observation is reserved in the lecture for selected small asymptomatic cases."], "take": "Symptoms and stability guide action; recurrence prevention is a separate decision.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 21\u201324; lecture transcript", "topic": "Pneumothorax", "kind": "Adapted professor", "image": "4"}, {"id": 7, "stem": "While being monitored for pleural air, a patient becomes hypotensive and unresponsive with tracheal deviation and unilateral reduced breath sounds. What best explains the deterioration?", "options": ["Tension pneumothorax", "Simple stable pneumothorax", "Re-expansion pulmonary edema before re-expansion", "Uncomplicated pleural effusion"], "why": ["A one-way leak raises pressure and impairs circulation.", "Hemodynamic collapse is not a simple stable course.", "No re-expansion has occurred in this scenario.", "A simple effusion does not best explain this abrupt evolution of an air leak."], "take": "New shock changes the problem from pleural air to tension physiology.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 25\u201326; lecture transcript", "topic": "Pneumothorax", "kind": "Adapted professor", "image": null}, {"id": 8, "stem": "A 60-year-old heavy smoker has progressive dyspnea, 20-lb weight loss, saturation 90%, and left-sided dullness with reduced breath sounds. A sizable new effusion is confirmed. What is the best next step?", "options": ["Admit and perform thoracentesis", "Outpatient oral antibiotics alone", "Admit for bronchodilators and oxygen alone", "Admit for IV antibiotics without sampling"], "why": ["The cause is unknown; sampling provides diagnosis and can relieve symptoms.", "Pneumonia has not been established, and the patient is significantly symptomatic.", "Bronchodilators do not establish the cause of an effusion.", "Antibiotics alone presume an infectious cause without evidence."], "take": "Sample an unexplained symptomatic effusion rather than assuming its cause.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 28\u201331; lecture transcript", "topic": "Effusion management", "kind": "Adapted professor", "image": null}, {"id": 9, "stem": "Which condition most characteristically causes an exudative effusion?", "options": ["Lung cancer", "Heart failure", "Hypoalbuminemia from liver failure", "Renal volume overload"], "why": ["Malignant pleural involvement can increase permeability and impair drainage.", "Classically raises hydrostatic pressure and produces a transudate.", "Low plasma oncotic pressure favors transudation.", "Hydrostatic volume overload favors transudation."], "take": "Exudates point toward pleural inflammation, malignancy or lymphatic pathology.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 33, 36; lecture transcript", "topic": "Fluid analysis", "kind": "Adapted professor", "image": null}, {"id": 10, "stem": "Which cause most characteristically produces a transudative effusion?", "options": ["Pulmonary edema due to cardiomyopathy", "Parapneumonic inflammation", "Lung cancer", "Penetrating stab injury with blood in the pleura"], "why": ["Cardiac failure raises hydrostatic pressure.", "Parapneumonic effusions are exudates, even when uncomplicated.", "Malignant effusions are generally exudates.", "Traumatic pleural blood is not the classic hydrostatic transudate."], "take": "A systemic pressure imbalance can create an effusion without primary pleural inflammation.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 34\u201336; lecture transcript", "topic": "Fluid analysis", "kind": "Adapted professor", "image": null}, {"id": 11, "stem": "A 17-year-old with penetrating chest trauma has hypoxemia that improves after a chest tube. Which change best explains the initial breathing difficulty?", "options": ["Intrapleural pressure approached atmospheric pressure during inspiration", "Intrapleural pressure became more negative than normal", "Pain was the only cause of impaired ventilation", "Pressure rose in the pericardium rather than the pleura", "The normal elastic force of the chest wall pulled inward"], "why": ["Loss of the distending pressure permits lung recoil and collapse.", "More negative pleural pressure ordinarily favors lung inflation.", "Pain may contribute, but does not explain pleural air relieved by drainage.", "The case describes pleural injury, not tamponade.", "The chest wall tends outward at resting volume; lung tends inward."], "take": "Open communication removes the normal pressure coupling between chest wall and lung.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 48\u201349; lecture transcript", "topic": "Pneumothorax", "kind": "Adapted professor", "image": null}, {"id": 12, "stem": "After a stab superior to the right nipple, a man has a bubbling wound moving with respiration and saturation 90% on high-concentration oxygen. What is the most likely chest X-ray finding on the right?", "options": ["Pneumothorax", "Ninth-rib fracture", "Pleural effusion alone", "Upper-lobe consolidation", "Hemothorax alone"], "why": ["A bubbling open wound directly communicates with the pleural space.", "A fracture may coexist but is not established and does not explain bubbling.", "Fluid alone does not explain respiratory air movement at the wound.", "Consolidation does not account for the open pleural air route.", "Blood can coexist, but the defining clue identifies air."], "take": "Follow the observed air pathway before selecting associated traumatic injuries.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 50\u201351; lecture transcript", "topic": "Pneumothorax", "kind": "Adapted professor", "image": null}, {"id": 13, "stem": "A 63-year-old has exertional dyspnea and paroxysmal nocturnal dyspnea. Pleural fluid: pH 7.60, protein 2.0 g/dL (serum 7.8), LDH 66 U/L (serum 200), glucose 72 mg/dL. What is the best next study?", "options": ["Echocardiogram", "Chest tube placement", "CT chest as the next etiologic test", "Surgical pleurodesis consultation", "Start piperacillin\u2013tazobactam"], "why": ["Ratios of 0.26 and 0.33 plus nocturnal breathlessness support cardiac failure.", "No infected/complicated fluid or ongoing drain indication is given.", "The most targeted next test for the suspected cause is echo.", "Recurrence prevention is premature before treating cardiac disease.", "The supplied chemistry and story do not establish infection."], "take": "Classify fluid, then take the next reasoning step to the cause. Source lacks LDH ULN; the key assumes transudate.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 52\u201355; lecture transcript", "topic": "Effusion management", "kind": "Adapted professor", "image": null}, {"id": 14, "stem": "Pleural protein is 3.6 g/dL, serum protein 6.0; pleural LDH 90 U/L, serum LDH 220, serum LDH ULN 240. How should the fluid be classified?", "options": ["Exudate because the protein ratio alone exceeds its cutoff", "Transudate because both LDH tests are negative", "Exudate only if at least two criteria are positive", "Cannot classify without glucose"], "why": ["3.6/6 = 0.60 >0.5; one positive criterion is enough.", "Negative LDH tests do not cancel a positive protein ratio.", "Light criteria use OR, not a two-of-three rule.", "Glucose helps characterize cause, but is not a Light criterion."], "take": "Any ONE positive criterion establishes an exudate.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 37; lecture transcript", "topic": "Fluid analysis", "kind": "Original", "image": null}, {"id": 15, "stem": "Pleural protein is 2.0 g/dL (serum 7.0); LDH 170 U/L (serum 400); serum LDH ULN is 240. Under standard Light criteria, what is the classification?", "options": ["Exudate: absolute pleural LDH exceeds two-thirds of serum ULN", "Transudate: both patient-to-patient ratios are low", "Transudate: pleural LDH must exceed the full serum ULN", "Unclassifiable: measured serum LDH must equal its ULN"], "why": ["170 >160; the third criterion independently establishes exudate.", "This neglects the third criterion.", "The threshold is two-thirds of ULN, not the full ULN.", "Measured serum LDH and laboratory ULN are distinct inputs."], "take": "Do not confuse the patient\u2019s serum LDH with the laboratory upper reference limit.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 37; standard threshold clarified with BTS; lecture transcript", "topic": "Fluid analysis", "kind": "Original", "image": null}, {"id": 16, "stem": "A fluid has protein ratio 0.50, LDH ratio 0.60 and pleural LDH exactly two-thirds of serum ULN. Under standard Light criteria, which answer fits?", "options": ["No criterion is strictly positive; classify as transudate by these values", "All three criteria are positive", "Two criteria are positive", "The protein ratio alone establishes exudate"], "why": ["The criteria use > rather than \u2265. Exact equality does not pass.", "Equality is not greater than a threshold.", "Neither ratio passes by equality.", "Protein ratio must be greater than 0.50."], "take": "Read inequalities carefully; real measurements and clinical context still matter.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 37; BTS clarification; lecture transcript", "topic": "Fluid analysis", "kind": "Original", "image": null}, {"id": 17, "stem": "Protein and LDH ratios are both below their cutoffs. The serum LDH upper limit is 240 U/L. Which pleural LDH value would independently establish an exudate under standard criteria?", "options": ["170 U/L", "150 U/L", "140 U/L", "120 U/L"], "why": ["170 exceeds two-thirds of 240, which is 160.", "150 does not exceed the standard cutoff of 160. It would pass the slide 37 cutoff of 144, illustrating the discrepancy.", "140 does not exceed 160.", "120 does not exceed 160."], "take": "Standard absolute LDH cutoff: greater than two-thirds of the serum upper reference limit. Slide 37 prints 0.6 times ULN; the guide flags that discrepancy.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 37; BTS clarification; lecture transcript", "topic": "Fluid analysis", "kind": "Original", "image": null}, {"id": 18, "stem": "Pleural air develops immediately after central venous catheter insertion. Which etiologic category fits best?", "options": ["Iatrogenic pneumothorax", "Primary spontaneous pneumothorax", "Secondary spontaneous pneumothorax solely because a procedure occurred", "Chylothorax"], "why": ["A procedure-related injury is iatrogenic.", "There is an identified external procedural cause.", "Secondary spontaneous refers to underlying lung disease, not procedural causation.", "Chylothorax is lymph, not air."], "take": "Classify by the initiating event, not just the final air collection.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 12; lecture transcript", "topic": "Pneumothorax", "kind": "Original", "image": null}, {"id": 19, "stem": "Why are tall individuals predisposed to apical blebs in the pleural-pressure model?", "options": ["A vertical pleural pressure gradient produces greater apical distending pressure", "Pleural pressure is highest and most positive at the apex", "The apex contains no visceral pleura", "Pleural fluid production stops in tall individuals"], "why": ["More negative apical pleural pressure increases the alveolar-to-pleural distending gradient.", "This reverses the gradient described.", "The lung apex is covered by visceral pleura.", "Turnover is not described as stopping with height."], "take": "More negative surrounding pressure means greater distending pressure.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 13\u201314; lecture transcript", "topic": "Pneumothorax", "kind": "Original", "image": null}, {"id": 20, "stem": "At a fixed alveolar pressure of 0 cm H\u2082O, pleural pressure changes from \u22125 to 0 cm H\u2082O. What happens to transpulmonary pressure?", "options": ["Falls from +5 to 0 cm H\u2082O", "Rises from 0 to +5 cm H\u2082O", "Remains \u22125 cm H\u2082O", "Falls from 0 to \u221210 cm H\u2082O"], "why": ["Ptranspulmonary = Palveolar \u2212 Ppleural.", "This reverses the subtraction.", "The two pressure differences are not equal.", "Neither value follows from the given numbers."], "take": "Loss of a positive distending gradient allows lung recoil.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 9\u201311; lecture transcript", "topic": "Pneumothorax", "kind": "Original", "image": null}, {"id": 21, "stem": "A patient with unilateral absent breath sounds has hyperresonant percussion. Which additional finding most strongly changes urgency?", "options": ["Hypotension with rapidly worsening respiratory distress", "A stable heart rate of 82/min", "Mild pain with otherwise stable physiology", "Tall body habitus alone"], "why": ["Circulatory compromise suggests tension physiology and urgent decompression.", "Normal vital signs do not imply tension.", "Pain alone does not establish obstructive shock.", "Body habitus is susceptibility, not current hemodynamic status."], "take": "Treat the dangerous physiology, not a risk-factor stereotype.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 16, 26; lecture transcript", "topic": "Pneumothorax", "kind": "Original", "image": null}, {"id": 22, "stem": "Which interpretation best fits the supplied image?", "options": ["Pleural air with a visible collapsed-lung boundary", "Basal fluid producing a meniscus", "Diffuse alveolar consolidation", "Normal fully expanded lung"], "why": ["The pleural line and absence of peripheral vascular markings support pleural air.", "A fluid meniscus is an opacity, not the hyperlucent rim here.", "Consolidation increases opacity within lung.", "Peripheral markings do not extend to the chest wall in the affected region."], "take": "Find the lung edge, then examine the region beyond it.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 18; lecture transcript", "topic": "Recognition", "kind": "Original", "image": "0"}, {"id": 23, "stem": "What does this M-mode image most directly indicate?", "options": ["Absent motion consistent with a barcode pattern", "Normal granular seashore appearance below the pleural line", "Pleural fluid triglycerides above 110 mg/dL", "Hemodynamic shock proven by ultrasound"], "why": ["Parallel lines below the pleural line indicate absent detected sliding.", "Normal sliding yields a granular appearance below the line.", "Ultrasound cannot measure triglycerides.", "This image alone cannot establish shock or tension."], "take": "Absent sliding supports pneumothorax in context, but is not perfectly specific.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 17\u201319; lecture transcript", "topic": "Recognition", "kind": "Original", "image": "2"}, {"id": 24, "stem": "Which process is best demonstrated in this CT image?", "options": ["Air outside the lung with compressed lung remaining centrally", "Fluid filling all alveoli", "A completely normal peripheral lung", "A biochemical diagnosis of empyema"], "why": ["A dark pleural region without lung markings surrounds compressed lung.", "Alveolar fluid would increase lung attenuation.", "Lung markings are absent in the abnormal peripheral region.", "CT appearance alone does not establish pus chemistry or microbiology."], "take": "CT directly resolves pleural air when radiographs are equivocal in stable patients.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 20; lecture transcript", "topic": "Recognition", "kind": "Original", "image": "3"}, {"id": 25, "stem": "In a patient with pneumonia, fluid pH is 7.10, glucose 28 mg/dL and ultrasound shows multiple septations. What is the most appropriate treatment principle?", "options": ["Antibiotics plus pleural drainage", "Antibiotics alone because it is an exudate", "Diuresis alone", "Wait for frank pus before intervening"], "why": ["Low pH and complex fluid support a complicated pleural infection.", "An infected, loculated space requires source control.", "Hydrostatic overload does not explain this infectious pattern.", "Complicated infection can require drainage without visible pus."], "take": "Drain infected fluid; exudate classification is only the first step.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 39\u201346; lecture transcript", "topic": "Effusion management", "kind": "Original", "image": null}, {"id": 26, "stem": "A patient with pneumonia has a simple effusion, negative culture, pH 7.45 and glucose 90 mg/dL. Which statement is most accurate?", "options": ["It can be an uncomplicated exudate managed with treatment of pneumonia and reassessment", "It must be a transudate because pH is high", "All exudates require an immediate chest tube", "Normal glucose excludes an effusion"], "why": ["Reactive parapneumonic fluid can be exudative without complicated infection.", "pH does not determine Light classification.", "Drain decisions depend on infection, symptoms and other findings.", "Glucose does not determine whether fluid exists."], "take": "Uncomplicated versus complicated and transudate versus exudate are different classifications.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 45\u201346; lecture transcript", "topic": "Effusion management", "kind": "Original", "image": null}, {"id": 27, "stem": "Persistent infected pockets remain after a chest tube. Which treatment directly addresses the fibrinous partitions and viscous contents?", "options": ["Intrapleural tPA plus DNase", "Oxygen alone", "An echocardiogram", "Pleurodesis as the initial way to seal in infected fluid"], "why": ["The lecturer names tPA/DNase to improve drainage of complex infected fluid.", "Oxygen does not break up loculated fluid.", "Echo investigates cardiac function, not loculations.", "Active infection needs drainage, not sealing-in."], "take": "Persistent loculation can require intrapleural therapy or surgical decortication.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 45\u201346; transcript; lecture transcript", "topic": "Effusion management", "kind": "Original", "image": null}, {"id": 28, "stem": "A patient has rapidly developing pulmonary edema after a compressed lung is re-expanded by fluid removal. Which complication fits?", "options": ["Re-expansion pulmonary edema", "New chylothorax by definition", "Tension pneumothorax established solely by edema", "Normal pleural fluid turnover"], "why": ["The temporal association matches the named complication.", "Chyle requires lymphatic leakage, not simply re-expansion.", "Edema alone does not establish pleural pressure shock.", "Normal turnover is small and does not produce acute pulmonary edema."], "take": "Re-expansion edema can follow either air or fluid drainage.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 26, 45; lecture transcript", "topic": "Effusion management", "kind": "Original", "image": null}, {"id": 29, "stem": "A recurrent spontaneous pneumothorax is treated with talc pleurodesis. What is the intended mechanism?", "options": ["Inflammatory adhesion of visceral and parietal pleura reduces the space available for recurrence", "Relaxation of airway smooth muscle", "Permanent increase in pleural fluid production", "Lysis of a pulmonary embolus"], "why": ["Talc promotes pleural adhesion.", "That is a bronchodilator mechanism.", "More pleural fluid is not the recurrence-prevention goal.", "Pleurodesis is unrelated to thrombolysis of vascular emboli."], "take": "Pleurodesis prevents reaccumulation by promoting pleural apposition/adhesion.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 24; lecture transcript", "topic": "Pneumothorax", "kind": "Original", "image": null}, {"id": 30, "stem": "Pleural triglycerides are 180 mg/dL and the cells are lymphocyte predominant after thoracic surgery. Which process best explains the fluid?", "options": ["Thoracic duct disruption", "Isolated elevation of systemic hydrostatic pressure", "Open communication carrying only atmospheric air", "Urinary obstruction established by triglycerides"], "why": ["Fat-rich lymph leakage explains triglycerides above 110 and lymphocytes.", "Hydrostatic transudation does not specifically explain high triglycerides after surgery.", "Atmospheric air does not carry chyle.", "Urinothorax is evaluated with creatinine and urinary context."], "take": "Link the measured substance to the structure that carries it.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 41, 43\u201344; lecture transcript", "topic": "Special effusions", "kind": "Original", "image": null}, {"id": 31, "stem": "Peripheral blood hematocrit is 40% and pleural fluid hematocrit is 24%. Which interpretation fits the definition?", "options": ["Hemothorax: the pleural-to-blood ratio is 0.60", "Not hemothorax because pleural hematocrit is below 50% absolute", "Chylothorax because the fluid is cellular", "Urinothorax because the ratio exceeds 0.5"], "why": ["24/40 =0.60, exceeding half of blood hematocrit.", "The 50% refers to a relative ratio, not an absolute hematocrit.", "Chylothorax requires evidence of chyle.", "Urinothorax uses a creatinine ratio >1."], "take": "Use matching measurements in numerator and denominator.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 43; lecture transcript", "topic": "Special effusions", "kind": "Original", "image": null}, {"id": 32, "stem": "Obstructive urinary tract disease accompanies an effusion. Pleural creatinine is 3.0 mg/dL and serum creatinine is 1.5 mg/dL. What diagnosis is supported by this marker?", "options": ["Urinothorax", "Hemothorax", "Chylothorax", "Primary spontaneous pneumothorax"], "why": ["Pleural/serum creatinine =2 >1 in a fitting urinary context.", "No hematocrit data support blood.", "No triglyceride data support chyle.", "An effusion is fluid, not pleural air."], "take": "Creatinine ratio links pleural fluid to urinary pathology.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 43; lecture transcript", "topic": "Special effusions", "kind": "Original", "image": null}, {"id": 33, "stem": "A patient with weight loss and recurrent exudative fluid has two negative cytology samples but persistent high suspicion for malignancy. Which next step is appropriate?", "options": ["VATS with pleural biopsy", "Exclude malignancy permanently", "Repeat thoracentesis indefinitely as the only diagnostic strategy", "Treat as uncomplicated CHF without further evaluation"], "why": ["Tissue sampling is the lecturer\u2019s next step after two nondiagnostic samples.", "Cytology sensitivity is incomplete.", "The lecturer emphasizes moving to tissue rather than repeated low-yield fluid testing.", "The clinical picture still strongly suggests malignant disease."], "take": "A negative test with imperfect sensitivity does not erase a strong pretest suspicion.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 47; lecture transcript", "topic": "Effusion management", "kind": "Original", "image": null}, {"id": 34, "stem": "What feature in this ultrasound image raises concern for malignant pleural involvement?", "options": ["Nodular pleural/diaphragmatic surface projecting into fluid", "The image directly shows serum protein concentration", "Absence of any pleural abnormality", "An ECG rhythm indicating atrial fibrillation"], "why": ["The irregular nodular projection is the suspicious feature highlighted in the lecture.", "Ultrasound does not measure serum protein.", "The surface is visibly irregular.", "This is a thoracic ultrasound, not an ECG."], "take": "Nodules raise suspicion; cytology or tissue is needed for etiologic confirmation.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 42; lecture transcript", "topic": "Recognition", "kind": "Original", "image": "7"}, {"id": 35, "stem": "A patient with known rheumatoid arthritis has an exudate with very low glucose and low pH. Which conclusion is justified?", "options": ["Rheumatoid pleurisy is possible, but infection still requires consideration", "Low glucose proves empyema in every patient", "The fluid must be a transudate", "Low pH proves tension pneumothorax"], "why": ["Rheumatoid pleural inflammation can reproduce this chemistry.", "The lecture itself names rheumatoid pleurisy as a low-glucose cause.", "The premise and inflammatory disease support exudate.", "Fluid pH does not diagnose pressure-related pleural air."], "take": "Match chemistry to the whole patient; one value rarely establishes etiology.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 39\u201341; lecture transcript", "topic": "Special effusions", "kind": "Original", "image": null}, {"id": 36, "stem": "Pleural fluid is 85% lymphocytes. Which pair is compatible with this finding?", "options": ["Tuberculosis and lymphoma", "Primary spontaneous pneumothorax and asthma as the only causes", "Acute myocardial infarction and tension pneumothorax as the only causes", "Urinothorax and rib fracture as definitive diagnoses"], "why": ["Both are listed; other listed causes include chyle, rheumatoid disease, sarcoid and post-CABG.", "This excludes the actual lymphocytic differential.", "These are not the lecture\u2019s lymphocyte-predominant pair.", "A cell differential does not establish these diagnoses."], "take": "A predominant cell type narrows a differential; it does not complete it.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 41; lecture transcript", "topic": "Special effusions", "kind": "Original", "image": null}, {"id": 37, "stem": "Pleural eosinophils are 15%. Which statement is most accurate?", "options": ["Air, blood, drugs, fungi and malignancy remain possible", "Malignancy is excluded", "It proves tuberculosis", "It proves the fluid is normal"], "why": ["The lecture gives a broad differential once eosinophils exceed 10%.", "Malignancy is explicitly on the list.", "Eosinophilia is not specific for TB.", "This is not the listed normal differential."], "take": "Eosinophilia is a clue, not a benign guarantee.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 38, 41; lecture transcript", "topic": "Special effusions", "kind": "Original", "image": null}, {"id": 38, "stem": "A patient with cardiac failure has a borderline exudative classification despite a strongly hydrostatic clinical picture. What property of Light criteria helps explain the mismatch?", "options": ["High sensitivity can include some transudates among positives", "The criteria are perfectly specific", "A positive result establishes bacterial infection", "Serum comparisons are unnecessary"], "why": ["The lecturer emphasizes avoiding missed exudates, at a cost of specificity.", "The lecture explicitly says sensitivity is high, specificity lower.", "Exudate does not equal bacterial infection.", "Ratios require serum labs."], "take": "Use classification with clinical context, especially near thresholds.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 37; lecture transcript", "topic": "Fluid analysis", "kind": "Original", "image": null}, {"id": 39, "stem": "In a 70-kg adult, which pairing best distinguishes resident pleural-fluid volume from daily production?", "options": ["7\u201315 mL present; about 17\u201335 mL produced daily", "17\u201335 liters present; 7\u201315 liters produced daily", "No fluid present; no daily turnover", "2 liters present in each pleural space normally"], "why": ["These are the slide 7 teaching values.", "These volumes are orders of magnitude too high.", "A small continuously renewed fluid layer is normal.", "Two liters/day refers to chyle production in slide 44, not normal pleural volume."], "take": "Do not confuse the standing fluid volume with daily production or with thoracic duct chyle.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 7, 44; lecture transcript", "topic": "Anatomy", "kind": "Original", "image": null}, {"id": 40, "stem": "Which layer most directly explains pleuritic pain when inflamed?", "options": ["Parietal pleura", "Visceral pleura through rich somatic innervation", "Alveolar air itself", "Thoracic duct valves"], "why": ["Parietal pleura is somatically pain sensitive.", "The lecture emphasizes lack of somatic pain innervation in visceral pleura.", "Air itself is not an innervated tissue.", "Thoracic duct valves are not the pleural pain-sensing layer."], "take": "Parietal is pain sensitive; visceral covers the lung.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 3\u20134; lecture transcript", "topic": "Anatomy", "kind": "Original", "image": null}, {"id": 41, "stem": "A recurrent symptomatic malignant effusion persists despite cancer treatment. Which option allows ongoing drainage at home?", "options": ["Tunneled indwelling pleural catheter (PleurX)", "Repeated emergency needle decompression for tension", "An echocardiogram as a drainage method", "Bronchodilator inhalation to empty pleural fluid"], "why": ["A tunneled catheter permits symptom-directed drainage outside hospital.", "Needle decompression treats pleural air emergencies, not long-term fluid management.", "Echo is diagnostic and cannot drain fluid.", "Airway dilation does not remove pleural fluid."], "take": "Palliation can target recurrent breathlessness while underlying cancer therapy continues.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 47; lecture transcript", "topic": "Effusion management", "kind": "Original", "image": null}, {"id": 42, "stem": "This material was aspirated from the pleural space in a febrile patient. Which interpretation and action best fit?", "options": ["Frank pus supports empyema and requires drainage plus antibiotics", "Its appearance proves chylothorax without testing", "It establishes a hydrostatic transudate", "It eliminates the need for culture"], "why": ["The thick purulent appearance is the lecture example of empyema.", "Milky or opaque fluid must be interpreted with context and chemistry; this is the lecture pus image.", "A simple transudate is not typically purulent.", "Culture remains useful to direct treatment."], "take": "Recognize pus, then move to infection source control.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slides 40, 45; lecture transcript", "topic": "Recognition", "kind": "Original", "image": "6"}], "figures": [{"image": "0", "stem": "Identify the pleural abnormality and the two visual clues.", "answer": "Left pneumothorax: visible lung edge and absent markings lateral to it.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slide 18", "trap": "A dark region alone is insufficient; trace the pleural line."}, {"image": "1", "stem": "What does the pattern below the pleural line imply about motion?", "answer": "Granular seashore-type appearance below the line indicates sliding/motion at the sampled location.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slide 19", "trap": "This is a static M-mode image, not a live recording. It does not describe the entire hemithorax."}, {"image": "2", "stem": "How does the pattern below the line differ from normal sliding?", "answer": "Parallel horizontal lines persist below the pleural line: barcode sign, supporting absent sliding.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slide 19", "trap": "Absent sliding is not perfectly specific for pneumothorax; clinical context matters."}, {"image": "3", "stem": "Is the peripheral low-density region lung, fluid, or air outside lung? Explain.", "answer": "Pleural air: there are no lung markings within the dark peripheral collection; lung is displaced inward.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slide 20", "trap": "This image demonstrates air; it does not by itself establish hemodynamic tension."}, {"image": "5", "stem": "What explains the basal opacity and curved upper boundary?", "answer": "A sizable left pleural effusion produces a meniscus and obscures the base.", "source": "9-10-2026_Foot_Pleural_Disease.pptx, slide 28", "trap": "CXR shows the collection, not whether it is malignant, infected, or a transudate."}, {"image": "6", "stem": "What is the material, and why would the treatment differ from uncomplicated fluid?", "answer": "Frank purulent fluid is the lecture example of empyema. It needs function table(head,rows,cls=''){return `<div class="tablewrap"><table class="${cls}"><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function imageEl(id,alt='Image evidence'){return `<img class="evidence" src="${D.images[id]}" alt="${alt}">`}
function start(){let done=Object.keys(state.history).length;$('app').innerHTML=`<div class="card hero"><span class="pill">Six objectives · ${D.questions.length} questions · Seven figure challenges</span><h2 style="margin-top:16px">Make the findings predictable.</h2><p>First decide <b>air or fluid</b>. For air, ask whether the pressure problem is impairing circulation. For fluid, classify it, use its chemistry to narrow the cause, then decide whether drainage is diagnostic, therapeutic, or urgent.</p><div class="step"><b>Cause → altered pressure / permeability / drainage → pleural contents → lung mechanics → examination and imaging → next action.</b></div><button class="primary" onclick="nav(1)">Build the mechanism</button> <button onclick="practiceActive=false;nav(6)">Start a practice block</button></div><div class="grid"><div class="card"><h3>A repeatable question approach</h3><ol><li><b>Check stability.</b> Shock with pleural air? Think urgent decompression.</li><li><b>Identify the contents.</b> Hyperresonance suggests air; dullness suggests fluid.</li><li><b>For fluid, calculate.</b> Protein ratio, LDH ratio, absolute LDH versus serum ULN.</li><li><b>Use context and special markers.</b> Infection? Cancer? Chyle, blood, or urine?</li><li><b>Answer the actual next step.</b> Classifying an effusion is not the endpoint if the options ask for echo, drainage, or biopsy.</li></ol></div><div class="card"><h3>Use the lab in three passes</h3><p><b>Understand:</b> explore mechanisms and compare confusable conditions.</p><p><b>Retrieve:</b> interpret figures before revealing, then complete a 5–10 question block. Mark guesses honestly.</p><p><b>Repair:</b> review missed or uncertain answers when you choose. Explain the rule aloud, then finish with the printable exam sheet.</p><div class="bar"><span style="width:${100*done/D.questions.length}%"></span></div><p class="small">${done} of ${D.questions.length} questions answered in this browser.</p></div></div><div class="card" style="margin-top:18px"><h3>Objective coverage</h3>${table(['Objective','Where to study','Source slides'],[['1. Normal pleural anatomy','Mechanisms: anatomy panel; Condition guide; Practice','3–5'],['2. Normal physiology and turnover','Mechanisms: normal coupling, turnover, pressure model','5–7, 9–11, 56, 59'],['3. Pneumothorax and tension','Mechanisms; four pneumothorax entries; imaging; management practice','8–27, 48–51'],['4. Pleural effusion: causes, presentation, diagnosis, treatment','Condition guide; Compare; Recognition lab; practice','28–47, 52–56'],['5. Transudate versus exudate','Light calculator; master table; reverse-reasoning questions','33–38, 53–55'],['6. Types of effusion','Infection, malignant, chyle, blood, urine, rheumatoid/TB entries','39–47']])}</div><div class="note warn"><b>Lecture versus clarification:</b> the third Light cutoff is printed as 0.6 × serum ULN on slide 37; the standard is ⅔ × ULN. Both are shown throughout. The lecturer repeatedly prioritizes Light criteria and next-step reasoning. Detailed chylothorax treatment and animal anecdotes receive less weight.</div>`}
let mi=0,ms=1;
function mechanism(){ $('app').innerHTML=`<div class="card"><h2>Mechanisms</h2><p>Predict the next link out loud, then reveal it.</p><label for="mech">Explore a chain<select id="mech" onchange="mi=+this.value;ms=1;drawChain()">${D.mechanisms.map((x,i)=>`<option value="${i}" ${i===mi?'selected':''}>${x[0]}</option>`).join('')}</select></label><div id="chain"></div><button class="primary" id="nextStep" onclick="ms++;drawChain()">Reveal next step</button> <button onclick="ms=1;drawChain()">Restart chain</button></div><div class="grid"><div class="card"><h3>Pressure and lung expansion</h3><p class="small">Illustrative static model, not a measured pressure–volume curve. Alveolar pressure is fixed at 0 cm H₂O. Lung size is schematic.</p><label>Pleural pressure: <span id="pv"></span> cm H₂O<input id="pressure" type="range" min="-10" max="5" value="-5" step="1" oninput="pressure()"></label><div id="lung"></div><div id="pout" class="note"></div></div><div class="card"><h3>Anatomy that predicts the pathology</h3>${table(['Layer','Blood supply / sensation'],[['Parietal','Lines chest wall; systemic intercostal/costal supply; pain sensitive. Direct lymphatic stomata remove pleural fluid.'],['Visceral','Covers lung; bronchial circulation, with pulmonary contribution in transcript; lacks somatic pain sensitivity.'],['Potential space','Normally only 7–15 mL (70 kg, lecture). Thoracentesis targets this space without traversing visceral pleura.']])}<p class="source">${PPT}, slides 3–7. “Innervation from costal arteries” in transcript is a slip: arteries supply blood, not sensation.</p></div></div><div class="card" style="margin-top:18px"><h3>Turnover: volume is not production</h3><p>Slide 7: production <b>0.01–0.02 mL/kg/hour</b>; resident volume <b>0.1–0.2 mL/kg</b>.</p><label>Illustrative body mass (kg)<input type="number" id="mass" min="1" max="400" value="70" oninput="turnover()"></label><div id="turn"></div><p class="source">Calculated directly from slide 7 coefficients. The lecture rounds the 70-kg results to 17–35 mL/day and 7–15 mL present. These are lecture teaching estimates, not universal measured constants.</p><details><summary>See the lecture anatomy figures and turnover clarification</summary>${imageEl('9','Pleural anatomy from the lecture')}${imageEl('10','Pleural filtration and drainage anatomy from the lecture')}<p>The transcript correctly places direct lymphatic stomata on parietal pleura, while its polling model includes visceral reabsorption. Modern descriptions emphasize parietal lymphatic removal as the dominant route. <a href="https://www.ncbi.nlm.nih.gov/books/NBK513353/">Physiology reference</a>.</p><p class="source">${PPT}, slides 3 and 5.</p></details></div>`;drawChain();pressure();turnover()}
function drawChain(){let m=D.mechanisms[mi];ms=Math.min(ms,m.length-1);$('chain').innerHTML=m.slice(1,ms+1).map((s,i)=>`<div class="step"><b>${i+1}.</b> ${s}</div>`).join('');$('nextStep').disabled=ms>=m.length-1}
function pressure(){let p=+$('pressure').value,t=-p;$('pv').textContent=p;let w=70+Math.max(0,t)*8;$('lung').innerHTML=`<svg class="diagram" viewBox="0 0 400 235" role="img" aria-label="Schematic lung becomes less expanded as the distending pressure falls"><rect x="42" y="12" width="310" height="202" rx="65" fill="#eaf2f6" stroke="#8babb4" stroke-width="3"/><path d="M200 22 L200 72" stroke="#5c7981" stroke-width="9"/><ellipse cx="195" cy="125" rx="${w/2}" ry="${55+Math.max(0,t)*2}" fill="#b7d9c6" stroke="#438070" stroke-width="3"/><text x="195" y="132" text-anchor="middle" font-size="17" fill="#23343a">Lung</text><text x="50" y="233" font-size="13" fill="#56696c">Chest wall boundary · Pleural compartment outside lung</text></svg>`;$('pout').innerHTML=`<b>P<sub>TP</sub> = P<sub>alv</sub> − P<sub>pl</sub> = 0 − (${p}) = ${t>0?'+':''}${t} cm H₂O</b><br>${t>0?'A positive gradient distends the lung. More negative pleural pressure increases this gradient.':t===0?'The distending gradient has disappeared; elastic recoil favors collapse.':'Pleural pressure exceeds this fixed alveolar pressure, favoring compression. This static slider does not itself diagnose tension; shock requires clinical assessment.'}`}
function turnover(){let k=+$('mass').value;$('turn').innerHTML=k>0&&k<=400?`<div class="row"><div><span class="big">${(k*.01*24).toFixed(1)}–${(k*.02*24).toFixed(1)}</span> mL/day produced</div><div><span class="big">${(k*.1).toFixed(1)}–${(k*.2).toFixed(1)}</span> mL present</div></div>`:'Enter a body mass between 1 and 400 kg.'}
let ci=0;
function guide(){$('app').innerHTML=`<div class="card"><h2>Condition guide</h2><label>Condition<select id="condition" onchange="ci=+this.value;drawCondition()">${D.conditions.map((c,i)=>`<option value="${i}" ${ci===i?'selected':''}>${c.name}</option>`).join('')}</select></label><div id="conditionBody"></div></div>`;drawCondition()}
function drawCondition(){let c=D.conditions[ci];$('conditionBody').innerHTML=`<h3 style="margin-top:20px">${c.name}</h3>${['Cause','Mechanism','Findings','Diagnosis','Treatment'].map(k=>`<div class="step"><b>${k}</b><br>${c[k]}</div>`).join('')}<div class="note warn"><b>Exam trap / counterpart</b><br>${c.Trap}</div><p class="source">${c.source}</p>`}
let ca=0,cb=4;
function compare(){$('app').innerHTML=`<div class="card"><h2>Compare two conditions</h2><div class="grid"><label>First<select id="ca" onchange="ca=+this.value;drawCompare()">${D.conditions.map((c,i)=>`<option value="${i}" ${i===ca?'selected':''}>${c.name}</option>`).join('')}</select></label><label>Second<select id="cb" onchange="cb=+this.value;drawCompare()">${D.conditions.map((c,i)=>`<option value="${i}" ${i===cb?'selected':''}>${c.name}</option>`).join('')}</select></label></div><div id="cmp"></div></div><div class="card"><h3>Master comparison</h3>${master()}</div>`;drawCompare()}
function drawCompare(){$('cmp').innerHTML=table(['Dimension',D.conditions[ca].name,D.conditions[cb].name],['Cause','Mechanism','Findings','Diagnosis','Treatment','Trap'].map(k=>[k,D.conditions[ca][k],D.conditions[cb][k]]),'compare-table')}
function master(){return table(['Pattern','Discriminator','Action logic'],[['Pneumothorax','Hyperresonance + pleural line + absent peripheral markings','Assess symptoms and stability; drain when indicated.'],['Tension','Pleural air with circulatory/respiratory compromise','Decompress immediately, then definitive drainage.'],['Transudate','No positive Light criterion; systemic force imbalance','Treat cardiac/renal/hepatic cause.'],['Exudate','Any one Light criterion positive','Find cause; infection, symptoms and complexity determine drainage.'],['Complicated infection','Low pH, low glucose, septations, positive microbiology or pus','Antibiotics + drain; residual pockets may need tPA/DNase or surgery.'],['Malignancy','Weight loss, recurrent exudate, nodules; cytology may be negative','Tissue if persistent suspicion; cancer therapy and symptom relief.'],['Chylothorax','Triglycerides >110 mg/dL, often lymphocytes','Identify thoracic duct / lymphatic cause.'],['Hemothorax','Pleural Hct >0.5 × blood Hct','Treat blood loss/injury and pleural collection.'],['Urinothorax','Pleural creatinine / serum creatinine >1','Address urinary cause.']])}
function recognition(){$('app').innerHTML=`<div class="card"><h2>Recognition lab</h2><p>Change the evidence and explain why the classification or next action changes.</p><h3>Light’s criteria calculator</h3><div class="note warn">Slide 37 uses <b>0.6 × serum LDH ULN</b>; standard criteria use <b>⅔ × ULN</b>. Both outputs appear below. This calculator is a study tool.</div><div class="row"><button onclick="preset([2,7.8,66,200,240])">Hydrostatic pattern</button><button onclick="preset([3.6,6,90,220,240])">One criterion positive</button><button onclick="preset([2.1,7,150,375,240])">Discrepancy interval</button></div><div class="grid">${[['fp','Pleural protein (g/dL)',2],['sp','Serum protein (g/dL)',7.8],['fl','Pleural LDH (U/L)',66],['sl','Serum LDH (U/L)',200],['ul','Serum LDH upper limit of normal (U/L)',240]].map(([id,l,v])=>`<label>${l}<input id="${id}" type="number" min="0" step="any" value="${v}" oninput="lights()"></label>`).join('')}</div><div id="lightResult" aria-live="polite"></div><p class="source">${PPT}, slide 37; <a href="${BTS}">BTS Appendix 1, p. 3</a>. Serum LDH ULN is a laboratory reference value, not the patient’s measured serum LDH.</p></div><div class="grid"><div class="card"><h3>Recognize the physical pattern</h3><label>Change the dominant finding<select id="examPattern" onchange="physical()"><option value="air">Pleural air</option><option value="fluid">Pleural fluid</option><option value="tension">Pleural air + shock</option></select></label><div id="physical"></div></div><div class="card"><h3>Pneumonia-associated fluid</h3><label>Fluid pH<input type="number" id="ph" step=".01" min="6" max="8" value="7.10" oninput="infection()"></label><label>Collection<select id="complex" onchange="infection()"><option value="simple">Simple, no pus</option><option value="septa">Septated, no pus</option><option value="pus">Frank pus</option></select></label><div id="infection"></div><p class="small">This model assumes pneumonia / suspected pleural infection. Low pH from other causes does not automatically require the same treatment.</p></div></div><div class="card" style="margin-top:18px"><h3>Additional fluid clues</h3>${table(['Finding from lecture','Think','Reasoning / limit'],[['pH <7.2','Complicated infection, esophageal rupture, RA, TB, malignancy, hemothorax, systemic acidemia','Acidic fluid is not specific for infection.'],['Glucose <60 mg/dL','Lecture emphasizes empyema and rheumatoid pleurisy','Clarification: TB and malignancy may also reduce glucose.'],['Lymphocytes >80%','TB, chyle, lymphoma, RA, sarcoid, post-CABG','Choose using context and specific markers.'],['Eosinophils >10%','Air, blood, asbestos, drugs, fungi, malignancy','Does not exclude cancer.'],['Normal fluid, slide 38','pH 7.60–7.64; glucose >60; <500 nucleated cells','60–75% macrophages, 10–30% mesothelial, <10% lymphocytes, <5% neutrophils.']])}</div>`;lights();physical();infection()}
function preset(a){['fp','sp','fl','sl','ul'].forEach((x,i)=>$(x).value=a[i]);lights()}
function lights(){let ids=['fp','sp','fl','sl','ul'],v=ids.map(i=>$(i).value===''?NaN:+$(i).value);if(v.some(x=>!Number.isFinite(x)||x<0)||v[1]===0||v[3]===0||v[4]===0){$('lightResult').innerHTML='<div class="note warn">Enter all five nonnegative values; serum protein, serum LDH and ULN must be greater than zero.</div>';return}let[a,b,c,d,u]=v,r=a/b,l=c/d,base=r>.5||l>.6,std=base||c>u*2/3,lec=base||c>u*.6;$('lightResult').innerHTML=table(['Test','Calculation','Positive?'],[['Protein ratio',`${a} / ${b} = ${r.toFixed(3)}; cutoff >0.5`,r>.5?'Yes':'No'],['LDH ratio',`${c} / ${d} = ${l.toFixed(3)}; cutoff >0.6`,l>.6?'Yes':'No'],['Absolute LDH: standard',`${c} > ${(u*2/3).toFixed(2)} (⅔ × ${u})`,c>u*2/3?'Yes':'No'],['Absolute LDH: slide 37',`${c} > ${(u*.6).toFixed(2)} (0.6 × ${u})`,c>u*.6?'Yes':'No']])+`<div class="note ${std!==lec?'warn':''}"><b>Standard: ${std?'Exudate':'Transudate'} · Slide 37: ${lec?'Exudate':'Transudate'}</b><br>${std!==lec?'The printed lecture threshold changes this classification. This is the discrepancy interval.':'Both versions agree for these inputs.'} Any one positive test is enough. Fluid classification does not by itself establish the cause.</div>`}
function physical(){let v=$('examPattern').value;$('physical').innerHTML=`<div class="step">${v==='air'?'<b>Hyperresonance + reduced fremitus/breath sounds.</b><br>Air in the pleura changes percussion and separates sound-generating lung from the chest wall. Look for a pleural line and absent peripheral markings.':v==='fluid'?'<b>Dullness + reduced breath sounds.</b><br>Fluid replaces the normally air-dominated percussion field and compresses the lung. Look for a meniscus or dependent fluid; ultrasound shows fluid and possible septations.':'<b>Air-associated findings + hypotension / major deterioration.</b><br>Rising pleural pressure can reduce venous return and cardiac output. Tracheal shift may occur. Urgent decompression takes priority over confirmatory CT.'}</div>`}
function infection(){let raw=$('ph').value,p=+raw,c=$('complex').value;if(raw===''||p<6||p>8){$('infection').innerHTML='Enter a plausible pH between 6 and 8.';return}let txt=c==='pus'?'Frank pus = empyema: drain and treat with antibiotics regardless of this pH.':p<=7.2?'Supplemental BTS: pH ≤7.2 indicates high risk of complicated infection; insert a drain if ultrasound confirms safely accessible fluid.':p<7.4?'Supplemental BTS: pH >7.2 and <7.4 is intermediate risk. Review LDH, glucose, collection size, septations and the clinical course; this simplified model cannot decide from pH alone.':c==='septa'?'Despite pH ≥7.4, septations merit reassessment and may support drainage depending on the clinical course.':'At pH ≥7.4 with simple fluid, there is no immediate drain indication from these variables alone. Treat pneumonia and monitor.';$('infection').innerHTML=`<div class="note">${txt}</div><p class="small">Lecture table: uncomplicated pH >7.2 / glucose >40; complicated pH <7.2 / glucose <40. Slide 40 separately flags glucose <60. Positive culture or pus argues against an uncomplicated process. <a href="${BTS}">BTS pathway</a>.</p>`}
let fi=0;
function figures(){$('app').innerHTML=`<div class="card"><h2>Lecture figures</h2><p>State what you see and what it means before revealing. Original images are embedded; diagnostic slide titles are withheld.</p><div class="row"><label>Challenge<select id="figureSelect" onchange="fi=+this.value;drawFigure()">${D.figures.map((f,i)=>`<option value="${i}" ${i===fi?'selected':''}>Figure ${i+1}</option>`).join('')}</select></label></div><div id="figure"></div></div>`;drawFigure()}
function drawFigure(){let f=D.figures[fi];$('figure').innerHTML=`<h3>Figure ${fi+1}</h3><p>${f.stem}</p><div class="figure-stage">${imageEl(f.image,`Figure ${fi+1} image`)}</div><button style="margin-top:16px" class="primary" onclick="revealFigure()">Reveal interpretation and source</button><div id="figureAnswer" aria-live="polite"></div>`}
function revealFigure(){let f=D.figures[fi];$('figureAnswer').innerHTML=`<div class="note good"><b>What to notice</b><br>${f.answer}</div><div class="note warn"><b>Trap</b><br>${f.trap}</div><p class="source">${f.source}. Extracted original figure; slide title and surrounding text omitted. No clinical image findings were erased.</p>`}
function practice(){if(practiceActive&&block.length){renderQuestion();return}practiceActive=false;let h=Object.values(state.history),correct=h.filter(x=>x.correct).length,unc=h.filter(x=>x.confidence!=='sure').length;$('app').innerHTML=`<div class="card"><h2>Practice setup</h2><p>Questions mix forward and reverse reasoning. Sources and topic labels disappear when the block starts. Answer feedback never advances you automatically.</p><div class="grid three"><div><span class="big">${h.length}/${D.questions.length}</span><br>answered</div><div><span class="big">${correct}</span><br>correct</div><div><span class="big">${unc}</span><br>uncertain / guessed</div></div><div class="grid"><label>Topic<select id="topic"><option>All topics</option>${[...new Set(D.questions.map(q=>q.topic))].map(t=>`<option>${t}</option>`).join('')}</select></label><label>Source<select id="origin"><option>All sources</option><option>Professor</option><option>Adapted professor</option><option>Original</option></select></label><label>Block size<select id="size"><option value="5">5 questions</option><option value="10">10 questions</option><option value="20">20 questions</option><option value="99">All eligible</option></select></label><label>Question pool<select id="pool"><option value="new">Unanswered</option><option value="all">All (fresh attempts)</option><option value="repair">Missed or uncertain (fresh attempts)</option><option value="review">Review submitted answers</option></select></label></div><div class="row"><button class="primary" onclick="begin()">Start block</button><button onclick="exportProgress()">Export progress</button><button onclick="if(confirm('Clear all saved answers in this browser?')){state={history:{},order:{}};save();practice()}">Reset progress</button></div><p id="setupMessage" role="status"></p><p class="small">${persistence?'Local saving is available. Browser policies, private mode, moving the file or clearing browser data may affect persistence.':'Local saving is unavailable in this browser. Keep the file open and use Export progress.'}</p></div>`}
function shuffle(a){let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
let responses={};
function begin(){let t=$('topic').value,o=$('origin').value,p=$('pool').value;reviewMode=p==='review';let eligible=D.questions.filter(q=>(t==='All topics'||q.topic===t)&&(o==='All sources'||q.kind===o)).filter(q=>p==='new'?!state.history[q.id]:p==='repair'?state.history[q.id]&&(!state.history[q.id].correct||state.history[q.id].confidence!=='sure'):p==='review'?!!state.history[q.id]:true);if(!eligible.length){$('setupMessage').textContent='No questions match this pool. Change a filter or choose another pool.';return}block=shuffle(eligible.map(q=>q.id)).slice(0,+$('size').value);pos=0;responses={};for(let id of block){if(reviewMode){responses[id]=state.history[id]}else{state.order[id]=shuffle(D.questions[id-1].options.map((_,i)=>i))}}save();practiceActive=true;nav(6)}
function renderQuestion(){let q=D.questions[block[pos]-1],r=responses[q.id],order=r?r.order:state.order[q.id];let answer=r?`<div id="feedback">${feedback(q,r)}</div>`:'<div id="feedback" aria-live="polite"></div>';$('app').innerHTML=`<div class="card"><div class="row spread"><span class="pill">Question ${pos+1} of ${block.length}</span><button onclick="practiceActive=false;nav(6)">End block / setup</button></div><h2 style="margin-top:20px">Question ${pos+1}</h2><p id="stem">${q.stem}</p>${q.image?`<div class="figure-stage">${imageEl(q.image,`Question ${pos+1} image`)}</div>`:''}<fieldset class="choices" ${r?'disabled':''}><legend class="small">Select one answer</legend>${order.map((idx,i)=>`<label class="${r?(idx===0?'correct':idx===r.chosen?'wrong':''):''}"><input type="radio" name="answer" value="${idx}" ${r&&r.chosen===idx?'checked':''}>${String.fromCharCode(65+i)}. ${q.options[idx]}</label>`).join('')}</fieldset>${!r?'<label>Confidence<select id="confidence"><option value="">Choose confidence</option><option value="guess">Guess</option><option value="unsure">Uncertain</option><option value="sure">Confident</option></select></label><button class="primary" onclick="submitAnswer()">Submit answer</button><p id="validation" role="status"></p>':''}${answer}<div class="row" style="margin-top:20px"><button onclick="pos--;renderQuestion()" ${pos===0?'disabled':''}>Previous</button><button id="nextQuestion" class="primary" onclick="nextQuestion()" ${!r?'disabled':''}>${pos===block.length-1?'Finish block':'Next question'}</button></div></div>`}
function feedback(q,r){let chosen=r.order.indexOf(r.chosen),cor=r.order.indexOf(0);return `<div class="note ${r.correct?'good':'bad'}"><b>${r.correct?'Correct':'Incorrect'}</b> · Your answer: ${String.fromCharCode(65+chosen)}. ${q.options[r.chosen]}<br><b>Correct answer: ${String.fromCharCode(65+cor)}. ${q.options[0]}</b><br>Confidence: ${esc(r.confidence)}${r.correct&&r.confidence!=='sure'?' · Correct but uncertain: included in your review pool.':''}</div><h3>Why each option fits or fails</h3>${r.order.map((idx,i)=>`<div class="answer-review"><b>${String.fromCharCode(65+i)}. ${q.options[idx]}</b><br>${q.why[idx]}</div>`).join('')}<div class="note"><b>Teaching takeaway</b><br>${q.take}</div><p class="source"><b>${q.kind}</b><br>${q.source}${q.id>=14&&q.id<=17?`<br>Standard threshold: <a href="${BTS}">BTS Appendix 1, p. 3</a>.`:''}</p>`}
function submitAnswer(){let el=document.querySelector('input[name=answer]:checked'),conf=$('confidence').value;if(!el||!conf){$('validation').textContent='Select an answer and confidence before submitting.';return}let id=block[pos],chosen=+el.value;let r={chosen,confidence:conf,correct:chosen===0,order:[...state.order[id]],at:new Date().toISOString()};responses[id]=r;state.history[id]=r;save();renderQuestion()}
function nextQuestion(){if(!responses[block[pos]])return;if(pos<block.length-1){pos++;renderQuestion();window.scrollTo(0,0)}else{let rr=Object.values(responses);$('app').innerHTML=`<div class="card"><h2>Block complete</h2><p><b>${rr.filter(r=>r.correct).length}/${rr.length} correct</b>; ${rr.filter(r=>r.confidence!=='sure').length} marked uncertain or guessed.</p><p>Explain one rule you can now use on a different question. Review when you are ready.</p><div class="row"><button onclick="pos=0;renderQuestion()">Review this block</button><button class="primary" onclick="practiceActive=false;nav(6)">Return to setup</button></div></div>`}}
